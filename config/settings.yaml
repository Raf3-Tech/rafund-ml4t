# ML4T configuration — override any value via .env (see .env.example)

database:
  host: localhost
  port: 5432
  database: rafund
  user: postgres
  password: ${DB_PASSWORD}

collect:
  start_date: "2017-08-17"
  timeframe: "1d"
  symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - ADA/USDT
    - DOT/USDT
    - LINK/USDT
    - XRP/USDT

evaluation:
  pair_a: BTC/USDT
  pair_b: ETH/USDT
  account_size: 5000
  step1_profit: 250
  step2_profit: 500
  max_daily_loss_pct: 0.04
  max_drawdown_pct: 0.06
  max_leverage: 5.0

strategy:
  name: pairs_stat_arb
  lookback_period: 60
  entry_threshold: 2.0
  exit_threshold: 0.5
  leg_allocation_pct: 0.18
  stop_loss_spread_pct: 0.03
  max_holding_days: 30

backtesting:
  commission: 0.001

data:
  timeframe: 1d

monitoring:
  log_level: INFO
  log_file: ./logs/ml4t.log
