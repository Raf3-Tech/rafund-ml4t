# CI pipeline for rafund-ml4t (Python 3.12 quant-trading repo)
#
# Job DAG:
#
#     lint (advisory)
#     unit ─┬─► coverage ─┐
#           └─► db ───────┴─► build
#
#   - unit: full offline suite (live-DB tests skip with an explicit reason)
#   - db:   Postgres 16 service → migrations → DB check → full suite with
#           RAFUND_LIVE_DB=1 → offline benchmark smoke test. BLOCKING.
#   - coverage: offline suite under coverage (gate 60%)
#   - build: byte-compile + import smoke
#
# Lint stays advisory (continue-on-error) until the repo adds a ruff config.

name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # LINT — advisory (continue-on-error). ruff is NOT in requirements.txt, so we
  # install it here. Flip `continue-on-error` to false (or delete it) once the
  # repo adds a [tool.ruff] config and the existing lint debt is cleaned up, to
  # make lint a BLOCKING gate.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check . --exclude venv

      - name: Ruff format check
        run: ruff format --check . --exclude venv

  # ---------------------------------------------------------------------------
  # UNIT — the bulk of the suite; tests mock the DB so no Postgres is needed.
  # BLOCKING. The integration-only / live-DB tests are deselected by keyword so
  # this job stays offline and deterministic.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime dirs
        run: mkdir -p logs

      - name: Run unit tests
        env:
          # Force JSON structured logs in CI so output is machine-parseable.
          LOG_FORMAT: json
          LOG_LEVEL: WARNING
        run: |
          pytest -q -rs

  # ---------------------------------------------------------------------------
  # DB — Postgres 16 service, migrations, a connectivity/read-path check, the
  # full suite including live-DB tests (RAFUND_LIVE_DB=1), and a benchmark
  # smoke test. BLOCKING. The benchmark uses the explicit --offline flag
  # (synthetic model, no MLflow registry needed); the online path is covered
  # by unit tests asserting it fails loudly rather than falling back.
  # ---------------------------------------------------------------------------
  db:
    name: DB + benchmark (Postgres)
    runs-on: ubuntu-latest
    needs: [unit]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rafund
          POSTGRES_PASSWORD: rafund_ci
          POSTGRES_DB: rafund
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rafund -d rafund"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rafund:rafund_ci@localhost:5432/rafund
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: rafund
      DB_USER: rafund
      DB_PASSWORD: rafund_ci
      LOG_FORMAT: json
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: DB check (connectivity + read path)
        run: |
          python - <<'PY'
          import sys
          from data.db import DatabaseConnection
          db = DatabaseConnection()
          try:
              if not db.test_connection():
                  sys.exit("DB connection test failed")
              df = db.read_sql("SELECT %s::int AS ok", [1])
              assert int(df.iloc[0]["ok"]) == 1, df
              n = int(db.read_sql("SELECT COUNT(*) AS n FROM prices").iloc[0]["n"])
              print(f"DB check OK (prices rows: {n})")
          finally:
              db.close_pool()
          PY

      - name: Create runtime dirs
        run: mkdir -p logs

      - name: Run full test suite (incl. live-DB tests)
        env:
          RAFUND_LIVE_DB: "1"
        run: pytest -q -rs

      - name: Benchmark smoke test (offline)
        run: |
          python main.py benchmark --offline --model ci_smoke --symbol BTC/USDT --runs 25 | tee benchmark.txt
          grep -q "mode=offline" benchmark.txt
          grep -q "p95_ms" benchmark.txt

  # ---------------------------------------------------------------------------
  # COVERAGE — full offline suite under coverage. Reports to the run summary and
  # uploads the XML artifact.
  #
  # TARGET coverage: 80% (the goal for this codebase).
  # ENFORCED gate:   --cov-fail-under=60  (realistic current floor).
  #
  # 60 is a ratchet: raise it toward 80 as coverage improves. Bump this
  # number — don't lower it — over time.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (gate 60% / target 80%)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime dirs
        run: mkdir -p logs

      - name: Run tests with coverage
        env:
          LOG_FORMAT: json
          LOG_LEVEL: WARNING
        run: |
          pytest -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # BUILD — final gate. No pyproject/setup.py exists, so this is an import smoke
  # test of every top-level package + a full byte-compile of the tree.
  # ---------------------------------------------------------------------------
  build:
    name: Build / import smoke
    runs-on: ubuntu-latest
    needs: [db, coverage]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile entire source tree
        run: python -m compileall -q config data features models monitoring portfolio strategies backtesting main.py

      - name: Import smoke test (top-level packages)
        run: |
          python -c "import config, data, features, models, monitoring, portfolio, strategies, backtesting; print('import smoke OK')"
